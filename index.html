<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Chiquii ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1 {
            color: #e63946;
            font-size: 2.2rem;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #555;
        }
        .photo-frame {
            width: 100%;
            max-height: 380px;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        .btn {
            background-color: #e63946;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn:hover {
            background-color: #d62828;
            transform: scale(1.05);
        }
        #secret-message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #ffe5ec;
            border-radius: 10px;
            color: #c9184a;
            font-weight: 500;
        }

        .spotify-container {
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Local photo uploaded to repository -->
        <img src="us.jpg" alt="Photo of us" class="photo-frame">
        
        <h1>Hi Chiquii! ❤️</h1>
        <p>I built this little corner of the internet just for you. Thank you for being so amazing every single day.</p>
        
        <button class="btn" onclick="revealSurprise()">Click for a surprise!</button>
        
        <div id="secret-message">
            💖 I love you more every day, Chiquii! 💖
        </div>
    </div>

    <div class="spotify-container">
        <!-- Spotify Player for Ben&Ben - Leaves (Reimagined) -->
        <iframe id="spotify-player"
                style="border-radius:12px" 
                src="https://open.spotify.com/embed/track/4WgfuNwzjQPRmvqz7GGAmf?utm_source=generator" 
                width="100%" 
                height="152" 
                frameBorder="0" 
                allowfullscreen="" 
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                loading="lazy">
        </iframe>
    </div>

    <script>
        function revealSurprise() {
            // Show secret message
            const msg = document.getElementById('secret-message');
            msg.style.display = (msg.style.display === 'block') ? 'none' : 'block';

            // Trigger Spotify Autoplay
            const player = document.getElementById('spotify-player');
            player.src = "https://open.spotify.com/embed/track/4WgfuNwzjQPRmvqz7GGAmf?utm_source=generator&autoplay=1";
        }
    </script>
</body>
</html>
